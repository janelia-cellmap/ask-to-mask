# GT-only control run for the 2.5D mitochondria model.
#
# Same architecture/loss/training budget as configs/train_mito_2p5d_fixed_fov.yaml,
# but trains exclusively on curated ground truth (no UNet-derived pseudo labels,
# no curriculum). Compare this run's val/gt dice/IoU/boundary/object metrics
# against the mixed-training run's val/gt metrics (and both against
# val/gt/comparison/unet, the existing UNet pipeline's own accuracy) to see
# whether pseudo-label pretraining is actually helping or just diluting signal
# back toward the UNet baseline this project is trying to beat.

model:
  architecture: convnext_unet
  encoder: convnext_small
  pretrained: false
  decoder_channels: 256
  dropout: 0.05
  # channel 0: mito mask logits, channel 1: boundary logits, channel 2: signed-distance logits
  output_channels: 3

data:
  dataset_type: fixed_fov_gt
  # Effective train samples/epoch for the GT-only path (fixed_fov_gt ignores
  # data.gt.samples_per_epoch and always uses this top-level value).
  samples_per_epoch: 128
  min_mask_fraction: 0.01

  # 2.5D input: [z-4 ... z ... z+4], center slice target only.
  stack_depth: 9
  z_offsets: null

  # Comparison baseline (existing UNet inference pipeline) attached to GT
  # validation crops so val/gt/comparison/unet/* is directly comparable.
  segmentation_path_template: "/nrs/cellmap/data/{dataset}/{dataset}.zarr/recon-1/labels/inference/segmentations"
  label_name: mito
  raw_target_resolution_nm: 8.0
  comparison_masks:
    enabled: true
    name: unet

  gt:
    data_root: /nrs/cellmap/data
    norms_csv: configs/norms.csv
    organelles:
      - mito
    fov_nm: 8192.0
    target_resolution_nm: 8.0
    target_size: 1024
    raw_require_exact_resolution: true
    min_mask_fraction: 0.01
    cache_dir: configs
    auto_norms: true
    auto_norms_per_image: false
    auto_norms_percentile_low: 1.0
    auto_norms_percentile_high: 99.0
    augment: true
    intensity_augment: true
    label_weight: 1.0
    skip_datasets: []
    validation_datasets:
      - jrc_hela-3
      - jrc_mus-liver-zon-2
      - jrc_mus-salivary-3
      - jrc_mus-pancreas-7
      - jrc_zf-pancreas-1

loss:
  bce_weight: 1.0
  focal_weight: 0.0
  dice_weight: 0.7
  tversky_weight: 0.3
  tversky_alpha: 0.3
  tversky_beta: 0.7
  boundary_weight: 0.2
  boundary_radius_px: 2
  distance_weight: 0.05
  distance_max_px: 32.0
  distance_beta: 0.1
  pos_weight: null

metrics:
  threshold: 0.5
  boundary_radius_px: 2
  boundary_tolerance_px: 2
  object_match_iou: 0.1

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  validation_batch_size: 1
  # Match the CPU slots reserved in the bsub job (-n 12, one A100's
  # proportional share of a 4-GPU/48-slot node).
  num_workers: 10
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  learning_rate: 2.0e-4
  weight_decay: 0.05
  lr_scheduler: cosine
  lr_warmup_steps: 200
  min_lr_ratio: 0.05
  max_train_steps: 5000
  mixed_precision: bf16
  seed: 42
  max_grad_norm: 1.0
  compile: false

  validation_steps: 250
  max_validation_batches: 8
  train_image_log_steps: 250
  checkpointing_steps: 1000
  num_train_images: 2
  num_validation_images: 4

  output_dir: runs/mito-2p5d-gt-only

logging:
  report_to: tensorboard
  project: mito-2p5d
  log_steps: 10
